<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黃金買賣快速記帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-100 p-4 min-h-screen">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6 space-y-5">
    <h2 class="text-2xl font-bold text-center text-amber-600">黃金買賣快速記帳</h2>
    
    <form id="goldForm" class="space-y-4">
      <!-- 交易類型 -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">交易類型</label>
        <select id="type" onchange="toggleFormMode(); calculateTotal();" class="w-full p-3 border rounded-xl bg-slate-50 text-lg">
          <option value="賣出 (零售)">賣出 (店家賣給顧客)</option>
          <option value="買入 (回收)">買入 (店家回收舊金)</option>
        </select>
      </div>

      <!-- 飾品品項 -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">飾品品項</label>
        <select id="category" class="w-full p-3 border rounded-xl bg-slate-50 text-lg">
          <option value="項鍊" selected>項鍊</option>
          <option value="戒指">戒指</option>
          <option value="耳環">耳環</option>
          <option value="手環">手環</option>
          <option value="手鍊">手鍊</option>
          <option value="金豆">金豆</option>
          <option value="金條/金幣">金條 / 金幣</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <!-- 今日牌價 (賣出與買入) -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">當日牌價(賣出) (NT$)</label>
          <input type="number" id="rate" placeholder="賣出價" oninput="calculateTotal()" required class="w-full p-3 border rounded-xl text-lg">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">當日牌價(買入) (NT$)</label>
          <input type="number" id="buyRate" placeholder="買入/回收價" oninput="calculateTotal()" class="w-full p-3 border rounded-xl text-lg">
        </div>
      </div>

      <!-- 新金重量 -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" id="weightLabel">新金重量 (錢)</label>
        <input type="number" step="0.01" id="weight" placeholder="請輸入重量" oninput="calculateTotal()" required class="w-full p-3 border rounded-xl text-lg">
      </div>

      <!-- 💡 【賣出專用】舊金貼換設定區塊 -->
      <div id="tradeInvoicingSection" class="p-4 bg-amber-50/70 rounded-xl border border-amber-300 space-y-3">
        <div class="flex items-center gap-2">
          <input type="checkbox" id="hasTradeIn" onchange="toggleTradeInOptions()" class="w-5 h-5 accent-amber-600">
          <label for="hasTradeIn" class="text-sm font-bold text-slate-800 cursor-pointer">本次交易包含舊金貼換</label>
        </div>

        <div id="tradeInDetails" class="hidden space-y-3 pt-2 border-t border-amber-200">
          <!-- 舊金來源選擇 -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">舊金來源</label>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="setShopType('local')" id="btnShopLocal" class="py-2 border rounded-lg bg-amber-500 text-white text-xs font-bold shadow-sm">🏛️ 本店舊金 (不扣重)</button>
              <button type="button" onclick="setShopType('external')" id="btnShopExternal" class="py-2 border rounded-lg bg-white text-xs font-bold border-amber-300 text-amber-700 shadow-sm">🔄 外店舊金 (需扣重)</button>
            </div>
          </div>

          <!-- 舊金重量輸入 -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">舊金毛重 (錢)</label>
            <input type="number" step="0.01" id="oldWeight" placeholder="請輸入舊金重量" oninput="calculateTotal()" class="w-full p-2.5 border rounded-lg text-base bg-white">
          </div>

          <!-- 外店扣重比例區塊 (選外店時顯示) -->
          <div id="externalRatioBox" class="hidden">
            <label class="block text-xs text-slate-600 mb-1">外店扣重折算比例</label>
            <div class="flex gap-2 mb-1">
              <button type="button" onclick="setTradeInRatio(0.95)" class="flex-1 py-1 border rounded bg-white text-xs text-slate-600">95折(0.95)</button>
              <button type="button" onclick="setTradeInRatio(0.90)" class="flex-1 py-1 border rounded bg-white text-xs text-slate-600">90折(0.90)</button>
              <button type="button" onclick="setTradeInRatio(0.85)" class="flex-1 py-1 border rounded bg-white text-xs text-slate-600">85折(0.85)</button>
            </div>
            <input type="number" step="0.01" id="tradeInRatio" value="0.95" oninput="calculateTotal()" class="w-full p-2 border rounded-lg text-base bg-white">
          </div>
        </div>
      </div>

      <!-- 💡 【買入專用】單純回收區塊 -->
      <div id="pureRecycleSection" class="hidden p-4 bg-amber-50/50 rounded-xl border border-amber-200 space-y-3">
        <label class="block text-sm font-medium text-amber-900">回收計算規則</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="setPureRatio(1.0)" class="py-2 border rounded-lg bg-white text-xs font-bold border-amber-400 text-amber-800 shadow-sm">🏛️ 本店售出 (不扣重)</button>
          <button type="button" onclick="setPureRatio(0.95)" class="py-2 border rounded-lg bg-white text-xs font-bold border-amber-300 text-amber-700 shadow-sm">🔄 外店舊金 (需扣重)</button>
        </div>
        <div class="flex gap-2 pt-1">
          <button type="button" onclick="setPureRatio(1.0)" class="flex-1 py-1.5 border rounded bg-white text-xs text-slate-600">不扣重 (1.0)</button>
          <button type="button" onclick="setPureRatio(0.95)" class="flex-1 py-1.5 border rounded bg-white text-xs text-slate-600">95折 (0.95)</button>
          <button type="button" onclick="setPureRatio(0.90)" class="flex-1 py-1.5 border rounded bg-white text-xs text-slate-600">90折 (0.90)</button>
          <button type="button" onclick="setPureRatio(0.85)" class="flex-1 py-1.5 border rounded bg-white text-xs text-slate-600">85折 (0.85)</button>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">自訂折算比例</label>
          <input type="number" step="0.01" id="pureRatio" value="1.0" oninput="calculateTotal()" class="w-full p-2 border rounded-lg text-base bg-white">
        </div>
      </div>

      <!-- 工錢 -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">新金工錢 (NT$)</label>
        <input type="number" id="laborFee" placeholder="請輸入工錢 (無則填0)" oninput="calculateTotal()" value="0" class="w-full p-3 border rounded-xl text-lg">
      </div>

      <!-- 總金額試算 -->
      <div class="p-4 bg-amber-50 rounded-xl border border-amber-200">
        <div class="text-sm text-amber-800 font-bold" id="calcDesc">試算總金額：</div>
        <div id="totalPriceDisplay" class="text-3xl font-extrabold text-amber-600">NT$ 0</div>
      </div>

      <!-- 備註 -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">備註 / 客戶資料</label>
        <input type="text" id="note" placeholder="可選填" class="w-full p-3 border rounded-xl text-lg">
      </div>

      <!-- 提交按鈕 -->
      <button type="button" onclick="submitData()" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl text-xl shadow-md transition">
        送出記帳
      </button>
    </form>
  </div>

  <script>
    const LIFF_ID = "2012013654-D2jb0NgH";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw_LnJdtJ2kiH19AaNSnxQx3IxMKxgkR4VLx6I7VUqwfdXN67wNiiStykPlbnUSPAYK/exec";

    let currentShopType = 'local';

    window.onload = function() {
      liff.init({ liffId: LIFF_ID }).catch(err => console.error(err));
      toggleFormMode();
    };

    function toggleFormMode() {
      const type = document.getElementById('type').value;
      const tradeInSection = document.getElementById('tradeInvoicingSection');
      const pureRecycleSection = document.getElementById('pureRecycleSection');
      const weightLabel = document.getElementById('weightLabel');
      
      if (type.includes("買入")) {
        tradeInSection.classList.add('hidden');
        pureRecycleSection.classList.remove('hidden');
        weightLabel.innerText = "回收毛重 (錢)";
        document.getElementById('pureRatio').value = "1.0";
      } else {
        tradeInSection.classList.remove('hidden');
        pureRecycleSection.classList.add('hidden');
        weightLabel.innerText = "新金重量 (錢)";
        document.getElementById('hasTradeIn').checked = false;
        document.getElementById('tradeInDetails').classList.add('hidden');
      }
      calculateTotal();
    }

    function toggleTradeInOptions() {
      const hasTradeIn = document.getElementById('hasTradeIn').checked;
      const details = document.getElementById('tradeInDetails');
      if (hasTradeIn) {
        details.classList.remove('hidden');
      } else {
        details.classList.add('hidden');
      }
      calculateTotal();
    }

    function setShopType(type) {
      currentShopType = type;
      const btnLocal = document.getElementById('btnShopLocal');
      const btnExternal = document.getElementById('btnShopExternal');
      const externalRatioBox = document.getElementById('externalRatioBox');

      if (type === 'local') {
        btnLocal.className = "py-2 border rounded-lg bg-amber-500 text-white text-xs font-bold shadow-sm";
        btnExternal.className = "py-2 border rounded-lg bg-white text-xs font-bold border-amber-300 text-amber-700 shadow-sm";
        externalRatioBox.classList.add('hidden');
        document.getElementById('tradeInRatio').value = "1.0";
      } else {
        btnExternal.className = "py-2 border rounded-lg bg-amber-500 text-white text-xs font-bold shadow-sm";
        btnLocal.className = "py-2 border rounded-lg bg-white text-xs font-bold border-amber-300 text-amber-700 shadow-sm";
        externalRatioBox.classList.remove('hidden');
        document.getElementById('tradeInRatio').value = "0.95";
      }
      calculateTotal();
    }

    function setTradeInRatio(val) {
      document.getElementById('tradeInRatio').value = val;
      calculateTotal();
    }

    function setPureRatio(val) {
      document.getElementById('pureRatio').value = val;
      calculateTotal();
    }

    function calculateTotal() {
      const type = document.getElementById('type').value;
      const newWeight = parseFloat(document.getElementById('weight').value) || 0;
      const sellRate = parseFloat(document.getElementById('rate').value) || 0;
      const buyRate = parseFloat(document.getElementById('buyRate').value) || 0;
      const laborFee = parseFloat(document.getElementById('laborFee').value) || 0;
      
      let total = 0;

      if (type.includes("賣出")) {
        const hasTradeIn = document.getElementById('hasTradeIn').checked;

        if (hasTradeIn) {
          const rawOldWeight = parseFloat(document.getElementById('oldWeight').value) || 0;
          const ratio = currentShopType === 'local' ? 1.0 : (parseFloat(document.getElementById('tradeInRatio').value) || 0.95);
          const finalOldWeight = rawOldWeight * ratio;

          if (currentShopType === 'local') {
            if (finalOldWeight <= newWeight) {
              const diffWeight = newWeight - finalOldWeight;
              total = (diffWeight * sellRate) + laborFee;
              document.getElementById('calcDesc').innerText = `【本店舊金 ≤ 新金】補差額(${diffWeight.toFixed(2)}錢×賣價) + 工錢：`;
            } else {
              const excessWeight = finalOldWeight - newWeight;
              total = laborFee - (excessWeight * buyRate);
              document.getElementById('calcDesc').innerText = `【本店舊金 > 新金】工錢 - 多餘舊金回收(${excessWeight.toFixed(2)}錢×買價)：`;
            }
          } else {
            if (finalOldWeight <= newWeight) {
              const newTotal = (newWeight * sellRate) + laborFee;
              const oldDeduct = finalOldWeight * sellRate;
              total = newTotal - oldDeduct;
              document.getElementById('calcDesc').innerText = `【外店舊金 ≤ 新金】(新金+工錢) - 舊金折抵(${finalOldWeight.toFixed(2)}錢×賣價)：`;
            } else {
              const excessWeight = finalOldWeight - newWeight;
              total = laborFee - (excessWeight * buyRate);
              document.getElementById('calcDesc').innerText = `【外店舊金 > 新金】工錢 - 多餘舊金淨重回收(${excessWeight.toFixed(2)}錢×買價)：`;
            }
          }
        } else {
          total = (newWeight * sellRate) + laborFee;
          document.getElementById('calcDesc').innerText = `試算總金額 (新金 ${newWeight} 錢 × 賣價 + 工錢)：`;
        }
      } else {
        const ratio = parseFloat(document.getElementById('pureRatio').value) || 1.0;
        const finalWeight = newWeight * ratio;
        const activeRate = buyRate || sellRate;
        total = (finalWeight * activeRate) - laborFee;
        const sourceText = ratio === 1.0 ? "本店(不扣重)" : `外店(折算 ${ratio})`;
        document.getElementById('calcDesc').innerText = `試算回收金額 [${sourceText}] (淨重 ${finalWeight.toFixed(2)} 錢 × 回收價)：`;
      }
      
      document.getElementById('totalPriceDisplay').innerText = `NT$ ${Math.round(total).toLocaleString()}`;
    }

    function submitData() {
      const btn = document.getElementById('submitBtn');
      const rawWeight = document.getElementById('weight').value;
      const rate = document.getElementById('rate').value;
      
      if (!rawWeight) {
        alert('請填寫重量！');
        return;
      }

      btn.disabled = true;
      btn.innerText = '處理中...';

      const type = document.getElementById('type').value;
      const category = document.getElementById('category').value;
      const weightNum = parseFloat(rawWeight);
      const rateNum = parseFloat(rate || 0);
      const buyRateNum = parseFloat(document.getElementById('buyRate').value || 0);
      const laborNum = parseFloat(document.getElementById('laborFee').value || 0);

      let ratioDesc = "無";
      let totalPrice = 0;

      if (type.includes("賣出")) {
        const hasTradeIn = document.getElementById('hasTradeIn').checked;

        if (hasTradeIn) {
          const rawOldWeight = parseFloat(document.getElementById('oldWeight').value) || 0;
          const ratio = currentShopType === 'local' ? 1.0 : (parseFloat(document.getElementById('tradeInRatio').value) || 0.95);
          const finalOldWeight = rawOldWeight * ratio;

          if (currentShopType === 'local') {
            if (finalOldWeight <= weightNum) {
              const diff = weightNum - finalOldWeight;
              ratioDesc = `【本店舊金貼換(輕)】舊金${rawOldWeight}錢 抵新金${weightNum}錢 | 補差額${diff.toFixed(2)}錢`;
              totalPrice = Math.round((diff * rateNum) + laborNum);
            } else {
              const excess = finalOldWeight - weightNum;
              ratioDesc = `【本店舊金貼換(重)】舊金${rawOldWeight}錢 抵新金${weightNum}錢 | 多餘${excess.toFixed(2)}錢按買價$${buyRateNum}回收`;
              totalPrice = Math.round(laborNum - (excess * buyRateNum));
            }
          } else {
            if (finalOldWeight <= weightNum) {
              ratioDesc = `【外店舊金貼換(輕)】舊金${rawOldWeight}錢(淨${finalOldWeight.toFixed(2)}) | 按賣價$${rateNum}折抵`;
              totalPrice = Math.round(((weightNum * rateNum) + laborNum) - (finalOldWeight * rateNum));
            } else {
              const excess = finalOldWeight - weightNum;
              ratioDesc = `【外店舊金貼換(重)】舊金${rawOldWeight}錢(淨${finalOldWeight.toFixed(2)}) 抵新金${weightNum}錢 | 多餘淨重${excess.toFixed(2)}錢按買價$${buyRateNum}回收`;
              totalPrice = Math.round(laborNum - (excess * buyRateNum));
            }
          }
        } else {
          ratioDesc = "無舊金貼換";
          totalPrice = Math.round((weightNum * rateNum) + laborNum);
        }
      } else {
        const ratio = parseFloat(document.getElementById('pureRatio').value) || 1.0;
        const finalWeight = weightNum * ratio;
        const activeRate = buyRateNum || rateNum;
        const sourceLabel = ratio === 1.0 ? "本店(不扣重)" : "外店(扣重)";
        ratioDesc = `${sourceLabel} | 毛重 ${weightNum} × 比例 ${ratio} = 淨重 ${finalWeight.toFixed(2)}`;
        totalPrice = Math.round((finalWeight * activeRate) - laborNum);
      }

      const payload = {
        type: type,
        category: category,
        rate: rateNum,
        buyRate: buyRateNum,
        weight: weightNum,
        ratioDesc: ratioDesc,
        laborFee: laborNum,
        price: totalPrice,
        note: document.getElementById('note').value
      };

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert('記帳成功！');
        document.getElementById('goldForm').reset();
        toggleFormMode();
        btn.disabled = false;
        btn.innerText = '送出記帳';
        try {
          liff.closeWindow();
        } catch (e) {
          console.log("非 LIFF 環境");
        }
      })
      .catch(err => {
        alert('發送失敗：' + err);
        btn.disabled = false;
        btn.innerText = '送出記帳';
      });
    }
  </script>
</body>
</html>
