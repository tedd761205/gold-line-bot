<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黃金買賣快速記帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-100 p-4 min-h-screen">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6 space-y-5">
    <h2 class="text-2xl font-bold text-center text-amber-600">黃金買賣快速記帳</h2>
    
    <form id="goldForm" class="space-y-4">
      <!-- 交易類型 -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">交易類型</label>
        <select id="type" onchange="toggleBuyOptions(); calculateTotal();" class="w-full p-3 border rounded-xl bg-slate-50 text-lg">
          <option value="賣出 (零售)">賣出 (店家賣給顧客)</option>
          <option value="買入 (回收)">買入 (店家回收舊金)</option>
        </select>
      </div>

      <!-- 飾品品項 -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">飾品品項</label>
        <select id="category" class="w-full p-3 border rounded-xl bg-slate-50 text-lg">
          <option value="項鍊" selected>項鍊</option>
          <option value="戒指">戒指</option>
          <option value="耳環">耳環</option>
          <option value="手環">手環</option>
          <option value="手鍊">手鍊</option>
          <option value="金豆">金豆</option>
          <option value="金條/金幣">金條 / 金幣</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <!-- 重量 -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" id="weightLabel">重量 (錢)</label>
        <input type="number" step="0.01" id="weight" placeholder="請輸入重量" oninput="calculateTotal()" required class="w-full p-3 border rounded-xl text-lg">
      </div>

      <!-- 回收扣重專用區塊 (預設隱藏) -->
      <div id="recycleSection" class="hidden p-4 bg-amber-50/50 rounded-xl border border-amber-200 space-y-3">
        <label class="block text-sm font-medium text-amber-900">回收計算方式</label>
        <div class="flex gap-2">
          <button type="button" onclick="setRatio(0.85)" id="btn085" class="flex-1 py-2 border rounded-lg bg-white text-sm font-bold border-amber-300 text-amber-700">× 0.85</button>
          <button type="button" onclick="setRatio(0.90)" id="btn090" class="flex-1 py-2 border rounded-lg bg-white text-sm font-bold border-amber-300 text-amber-700">× 0.90</button>
          <button type="button" onclick="setRatio(0.95)" id="btn095" class="flex-1 py-2 border rounded-lg bg-white text-sm font-bold border-amber-300 text-amber-700">× 0.95</button>
          <button type="button" onclick="setRatio(1.0)" id="btn100" class="flex-1 py-2 border rounded-lg bg-white text-sm font-bold border-amber-300 text-amber-700">不扣重</button>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">自訂扣重比例</label>
          <input type="number" step="0.01" id="customRatio" value="0.95" oninput="calculateTotal()" class="w-full p-2 border rounded-lg text-base bg-white">
        </div>
      </div>

      <!-- 今日金價 -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">每錢單價 (NT$)</label>
        <input type="number" id="rate" placeholder="請輸入當日牌價" oninput="calculateTotal()" required class="w-full p-3 border rounded-xl text-lg">
      </div>

      <!-- 工錢 -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">工錢 (NT$)</label>
        <input type="number" id="laborFee" placeholder="請輸入工錢 (無則填0)" oninput="calculateTotal()" value="0" class="w-full p-3 border rounded-xl text-lg">
      </div>

      <!-- 總金額試算 -->
      <div class="p-4 bg-amber-50 rounded-xl border border-amber-200">
        <div class="text-sm text-amber-800" id="calcDesc">試算總金額：</div>
        <div id="totalPriceDisplay" class="text-3xl font-extrabold text-amber-600">NT$ 0</div>
      </div>

      <!-- 備註 -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">備註 / 客戶資料</label>
        <input type="text" id="note" placeholder="可選填" class="w-full p-3 border rounded-xl text-lg">
      </div>

      <!-- 提交按鈕 -->
      <button type="button" onclick="submitData()" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl text-xl shadow-md transition">
        送出記帳
      </button>
    </form>
  </div>

  <script>
    const LIFF_ID = "2012013654-D2jb0NgH";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw_LnJdtJ2kiH19AaNSnxQx3IxMKxgkR4VLx6I7VUqwfdXN67wNiiStykPlbnUSP/exec";

    window.onload = function() {
      liff.init({ liffId: LIFF_ID }).catch(err => console.error(err));
      toggleBuyOptions();
    };

    function toggleBuyOptions() {
      const type = document.getElementById('type').value;
      const recycleSection = document.getElementById('recycleSection');
      const weightLabel = document.getElementById('weightLabel');
      
      if (type.includes("買入")) {
        recycleSection.classList.remove('hidden');
        weightLabel.innerText = "毛重 (錢)";
      } else {
        recycleSection.classList.add('hidden');
        weightLabel.innerText = "淨重 (錢)";
      }
    }

    function setRatio(val) {
      document.getElementById('customRatio').value = val;
      calculateTotal();
    }

    function calculateTotal() {
      const type = document.getElementById('type').value;
      const rawWeight = parseFloat(document.getElementById('weight').value) || 0;
      const rate = parseFloat(document.getElementById('rate').value) || 0;
      const laborFee = parseFloat(document.getElementById('laborFee').value) || 0;
      
      let finalWeight = rawWeight;

      if (type.includes("買入")) {
        const ratio = parseFloat(document.getElementById('customRatio').value) || 1;
        finalWeight = rawWeight * ratio;
      }

      let total = 0;
      if (type.includes("賣出")) {
        total = (finalWeight * rate) + laborFee;
        document.getElementById('calcDesc').innerText = `試算總金額 (淨重 ${finalWeight.toFixed(2)} 錢 + 工錢)：`;
      } else {
        total = (finalWeight * rate) - laborFee;
        document.getElementById('calcDesc').innerText = `試算回收金額 (淨重 ${finalWeight.toFixed(2)} 錢 - 工錢)：`;
      }
      
      document.getElementById('totalPriceDisplay').innerText = `NT$ ${Math.round(total).toLocaleString()}`;
    }

    function submitData() {
      const btn = document.getElementById('submitBtn');
      const rawWeight = document.getElementById('weight').value;
      const rate = document.getElementById('rate').value;
      
      if (!rawWeight || !rate) {
        alert('請填寫重量與單價！');
        return;
      }

      btn.disabled = true;
      btn.innerText = '處理中...';

      const type = document.getElementById('type').value;
      const category = document.getElementById('category').value;
      const weightNum = parseFloat(rawWeight);
      const rateNum = parseFloat(rate);
      const laborNum = parseFloat(document.getElementById('laborFee').value || 0);

      let finalWeight = weightNum;
      let ratioDesc = "無";

      if (type.includes("買入")) {
        const ratio = parseFloat(document.getElementById('customRatio').value) || 1;
        finalWeight = weightNum * ratio;
        ratioDesc = `毛重 ${weightNum} × 比例 ${ratio} = 淨重 ${finalWeight.toFixed(2)}`;
      }

      let totalPrice = 0;
      if (type.includes("賣出")) {
        totalPrice = Math.round((finalWeight * rateNum) + laborNum);
      } else {
        totalPrice = Math.round((finalWeight * rateNum) - laborNum);
      }

      const payload = {
        type: type,
        category: category,
        weight: weightNum,
        ratioDesc: ratioDesc,
        laborFee: laborNum,
        price: totalPrice,
        note: document.getElementById('note').value
      };

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert('記帳成功！');
        document.getElementById('goldForm').reset();
        toggleBuyOptions();
        calculateTotal();
        liff.closeWindow();
      })
      .catch(err => {
        alert('發送失敗：' + err);
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = '送出記帳';
      });
    }
  </script>
</body>
</html>
