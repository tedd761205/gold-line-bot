<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 修正平板與手機的視口縮放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>黃金買賣快速記帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-100 p-3 sm:p-6 min-h-screen">
  <!-- 💡 已將 max-w-xl 擴充為響應式寬度：平板與大螢幕會自動延伸，不再被鎖死在直式窄版 -->
  <div class="w-full max-w-xl sm:max-w-2xl md:max-w-4xl lg:max-w-5xl mx-auto bg-white rounded-2xl shadow-lg p-5 sm:p-8 space-y-6">
    <h2 class="text-2xl sm:text-3xl font-bold text-center text-amber-600">黃金買賣快速記帳</h2>
    
    <form id="goldForm" class="space-y-4">
      <!-- 交易類型 -->
      <div>
        <label class="block text-sm sm:text-base font-medium text-slate-700 mb-1">交易類型</label>
        <select id="type" onchange="toggleFormMode(); calculateTotal();" class="w-full p-3 border rounded-xl bg-slate-50 text-lg">
          <option value="賣出 (零售)">賣出 (店家賣給顧客)</option>
          <option value="買入 (回收)">買入 (店家回收舊金)</option>
        </select>
      </div>

      <!-- 飾品品項 -->
      <div>
        <label class="block text-sm sm:text-base font-medium text-slate-700 mb-1">飾品品項</label>
        <select id="category" class="w-full p-3 border rounded-xl bg-slate-50 text-lg">
          <option value="項鍊" selected>項鍊</option>
          <option value="戒指">戒指</option>
          <option value="耳環">耳環</option>
          <option value="手環">手環</option>
          <option value="手鍊">手鍊</option>
          <option value="金豆">金豆</option>
          <option value="金條/金幣">金條 / 金幣</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <!-- 今日牌價 (賣出與買入) -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1">當日牌價(賣出) (NT$)</label>
          <input type="number" id="rate" placeholder="賣出價" oninput="calculateTotal()" required class="w-full p-3 border rounded-xl text-lg">
        </div>
        <div>
          <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1">當日牌價(買入) (NT$)</label>
          <input type="number" id="buyRate" placeholder="買入/回收價" oninput="calculateTotal()" class="w-full p-3 border rounded-xl text-lg">
        </div>
      </div>

      <!-- 新金重量 -->
      <div>
        <label class="block text-sm sm:text-base font-medium text-slate-700 mb-1" id="weightLabel">新金重量 (錢)</label>
        <input type="number" step="0.01" id="weight" placeholder="請輸入重量" oninput="calculateTotal()" required class="w-full p-3 border rounded-xl text-lg">
      </div>

      <!-- 💡 【賣出專用】舊金貼換設定區塊 -->
      <div id="tradeInvoicingSection" class="p-4 bg-amber-50/70 rounded-xl border border-amber-300 space-y-3">
        <div class="flex items-center gap-2">
          <input type="checkbox" id="hasTradeIn" onchange="toggleTradeInOptions()" class="w-5 h-5 accent-amber-600">
          <label for="hasTradeIn" class="text-sm sm:text-base font-bold text-slate-800 cursor-pointer">本次交易包含舊金貼換</label>
        </div>

        <div id="tradeInDetails" class="hidden space-y-3 pt-2 border-t border-amber-200">
          <!-- 舊金來源選擇 -->
          <div>
            <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1">舊金來源</label>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="setShopType('local')" id="btnShopLocal" class="py-2.5 border rounded-lg bg-amber-500 text-white text-xs sm:text-sm font-bold shadow-sm">🏛️ 本店舊金 (不扣重)</button>
              <button type="button" onclick="setShopType('external')" id="btnShopExternal" class="py-2.5 border rounded-lg bg-white text-xs sm:text-sm font-bold border-amber-300 text-amber-700 shadow-sm">🔄 外店舊金 (需扣重)</button>
            </div>
          </div>

          <!-- 舊金重量輸入 -->
          <div>
            <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1">舊金毛重 (錢)</label>
            <input type="number" step="0.01" id="oldWeight" placeholder="請輸入舊金重量" oninput="calculateTotal()" class="w-full p-3 border rounded-lg text-base bg-white">
          </div>

          <!-- 外店扣重比例區塊 (選外店時顯示) -->
          <div id="externalRatioBox" class="hidden">
            <label class="block text-xs sm:text-sm text-slate-600 mb-1">外店扣重折算比例</label>
            <div class="flex gap-2 mb-2">
              <button type="button" onclick="setTradeInRatio(0.95)" class="flex-1 py-1.5 border rounded bg-white text-xs sm:text-sm text-slate-600">95折(0.95)</button>
              <button type="button" onclick="setTradeInRatio(0.90)" class="flex-1 py-1.5 border rounded bg-white text-xs sm:text-sm text-slate-600">90折
